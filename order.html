<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งผลไม้ปอก - 2 กอ</title>
<meta name="theme-color" content="#2F5233">
<link rel="manifest" href="./manifest-order.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'IBM Plex Sans Thai',sans-serif;background:#faf6ef;color:#332f26;padding-bottom:90px}
header{background:#2F5233;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;font-family:Kanit,sans-serif;font-size:18px}
header small{display:block;font-family:inherit;font-size:12px;opacity:.85;margin-top:2px}
#banner{display:none;background:#b23a3a;color:#fff;padding:10px 16px;font-size:14px}
h2{font-family:Kanit,sans-serif;font-size:15px;color:#8a5a2b;margin:18px 16px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px}
.card{background:#fff;border:1px solid #e7e2d6;border-radius:16px;overflow:hidden;padding:8px}
.card img,.card .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#eef1ea;display:flex;align-items:center;justify-content:center;font-size:30px}
.nm{font-size:14px;font-weight:600;margin:8px 0 2px;line-height:1.25}.pr{color:#2F5233;font-weight:600}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid #2F5233;background:#fff;color:#2F5233;font-size:20px;line-height:1}
.step button.plus{background:#2F5233;color:#fff}.step span{font-weight:600;min-width:24px;text-align:center}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e7e2d6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none}
.btn{width:100%;border:none;border-radius:12px;background:#2F5233;color:#fff;font:600 16px 'IBM Plex Sans Thai',sans-serif;padding:14px}
.btn:disabled{opacity:.5}
#sheet,#pickSheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
#sheet .in,#pickSheet .in{background:#faf6ef;width:100%;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:16px 'IBM Plex Sans Thai',sans-serif;padding:11px;border:1.4px solid #d8d2c2;border-radius:10px;background:#fff}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;text-align:center;border:1.5px solid #d8d2c2;border-radius:10px;padding:11px;background:#fff}
.seg input{display:none}.seg input:checked+span{color:#2F5233}.seg label:has(input:checked){border-color:#2F5233;background:#eaf1e6}
.line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}.tot{border-top:1.5px solid #e7e2d6;margin-top:6px;padding-top:8px;font-weight:600}
#err{color:#b23a3a;font-size:13px;margin:8px 0;min-height:16px}.hp{position:absolute;left:-9999px;opacity:0}
#done{display:none;text-align:center;padding:40px 24px}#done b{font-size:22px;color:#2F5233}
#mine{position:fixed;inset:0;z-index:20;background:#faf6ef;display:none;flex-direction:column}#mine.show{display:flex}
.mh{display:flex;align-items:center;gap:10px;background:#2F5233;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-family:Kanit,sans-serif;font-size:18px}.mh button{background:none;border:none;color:#fff;font-size:26px;line-height:1}
#mineList{flex:1;overflow:auto;padding:8px 16px 24px;max-width:700px;width:100%;margin:0 auto}
.oc{background:#fff;border:1px solid #e7e2d6;border-radius:14px;padding:12px;margin-bottom:10px}.oc .st{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:#fdebc8;color:#8a5a2b}
.oc .st.ok{background:#dcefd8;color:#2F5233}.oc .st.no{background:#eee;color:#777}.oc .sub{font-size:13px;color:#6b665a;margin-top:4px}
.card.out{opacity:.55}.card.out img,.card.out .ph{filter:grayscale(1)}
.soldtag{margin-top:8px;text-align:center;border-radius:10px;background:#eee;color:#777;font-weight:600;font-size:13px;padding:9px}
h2 .ct{font-size:12px;color:#b23a3a;font-family:'IBM Plex Sans Thai',sans-serif;margin-left:6px}
#welcome{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
#welcome .in{background:#fff;border-radius:20px;max-width:360px;width:100%;padding:24px 20px;text-align:center}
#welcome .ic{font-size:44px;line-height:1}#welcome h3{font-family:Kanit,sans-serif;font-size:20px;margin:10px 0 6px}
#welcome p{white-space:pre-line;margin:6px 0;font-size:14px;color:#4a463c}#welcome .nt{background:#faf6ef;border-radius:10px;padding:10px;margin:12px 0;font-size:14px;font-weight:600}
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div id="shop">2 กอ ผลไม้ปอกพร้อมทาน</div><small id="hours">สั่งออนไลน์ รับเองหรือนัดส่ง</small></div><button id="mineBtn" onclick="openMine()" style="background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:9px 12px;font:600 13px inherit;font-family:inherit">ออเดอร์ของฉัน</button></header>
<div id="banner"></div>
<div id="welcome"><div class="in"><div class="ic" id="wIc"></div><h3 id="wTitle"></h3><p id="wBody"></p><div class="nt" id="wNote" style="display:none"></div><button class="btn" onclick="welcome.style.display='none'">รับทราบ</button></div></div>
<div id="menu"><p style="padding:24px 16px">กำลังโหลดเมนู…</p></div>
<div id="done"><b>ส่งออเดอร์แล้ว</b><p id="doneTxt"></p><button class="btn" style="margin-bottom:8px" onclick="openMine()">ดูสถานะออเดอร์</button><button class="btn" onclick="location.reload()">สั่งเพิ่ม</button></div>
<div id="bar"><button class="btn" id="cartBtn"></button></div>

<div id="sheet"><div class="in">
  <h2 style="margin:0 0 6px">ยืนยันออเดอร์</h2>
  <div id="lines"></div>
  <label>วิธีรับสินค้า</label>
  <div class="seg"><label><input type="radio" name="m" value="รับเอง" checked><span>รับเองที่ร้าน</span></label><label><input type="radio" name="m" value="นัดส่ง"><span>นัดส่ง</span></label></div>
  <label>วันที่</label><select id="day"></select>
  <label>เวลา</label><select id="time"></select>
  <label>ชื่อ</label><input id="name" maxlength="60" autocomplete="name">
  <label>เบอร์โทร</label><input id="phone" inputmode="tel" maxlength="12" autocomplete="tel" placeholder="0812345678">
  <div id="addrBox" style="display:none"><label>ที่อยู่จัดส่ง</label><textarea id="addr" rows="3" maxlength="200"></textarea>
  <div style="font-size:12px;color:#7a7566;margin-top:4px">ร้านจะแจ้งค่าส่งอีกครั้งตอนยืนยันออเดอร์</div></div>
  <label>หมายเหตุ (ไม่บังคับ)</label><input id="note" maxlength="200">
  <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div id="err"></div>
  <button class="btn" id="submit">ส่งออเดอร์</button>
  <button class="btn" style="background:none;color:#332f26;margin-top:6px" onclick="sheet.style.display='none'">กลับไปแก้ตะกร้า</button>
</div></div>
<div id="pickSheet"><div class="in"><h2 id="pickTitle" style="margin:0 0 8px"></h2><div id="pickBox"></div>
  <label>จำนวน (กล่อง/ชิ้น) ที่เลือกผลไม้ชุดนี้</label><input id="pickQty" type="number" min="1" value="1">
  <div id="pickErr" style="color:#b23a3a;font-size:13px;margin:8px 0;min-height:16px"></div>
  <button class="btn" id="pickAdd">ใส่ตะกร้า</button>
  <button class="btn" style="background:none;color:#332f26;margin-top:6px" onclick="pickSheet.style.display='none'">ยกเลิก</button></div></div>
<div id="mine"><div class="mh"><button onclick="closeMine()">‹</button>ออเดอร์ของฉัน</div><div id="mineList"></div></div>
<script src="./config.js"></script>
<script>
const $=id=>document.getElementById(id),sheet=$('sheet');
let cfg=null,cart={},picks=[];const welcome=$('welcome');
const baht=n=>'฿'+Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const total=()=>cfg.menus.reduce((s,m)=>s+(cart[m.id]||0)*m.price,0)+picks.reduce((s,p)=>s+p.qty*p.price,0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0)+picks.reduce((s,p)=>s+p.qty,0);

async function load(){
  try{
    const r=await (await fetch(GAS_URL+'?action=getPublicMenus')).json();
    if(!r.menus)throw 0; cfg=r; render(); showWelcome();
  }catch(e){ $('menu').innerHTML='<p style="padding:24px 16px">โหลดเมนูไม่สำเร็จ กรุณารีเฟรชหน้านี้</p>'; }
}
function canOrder(){return cfg.open;}
const closedOn=v=>((cfg.shop&&cfg.shop.closedRanges)||[]).some(r=>v>=r[0]&&v<=r[1]);
const thDay=v=>new Date(v+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const rangeTxt=r=>r[0]===r[1]?thDay(r[0]):thDay(r[0])+' – '+thDay(r[1]);
function showWelcome(){
  const sh=cfg.shop||{},closed=!!sh.closedToday,paused=!cfg.open;
  $('wIc').textContent=closed||paused?'🔴':'🟢';
  $('wTitle').textContent=paused?'ร้านปิดรับออเดอร์ออนไลน์ชั่วคราว':closed?'วันนี้ร้านปิด':'วันนี้ร้านเปิด';
  $('wBody').textContent=paused?'กรุณากลับมาสั่งใหม่ภายหลัง':closed?'ขออภัย วันนี้ร้านปิดทำการ สั่งนัดวันอื่นได้':'รับออเดอร์นัดเวลา '+cfg.openTime+' - '+cfg.closeTime+' น.';
  const rg=sh.closedRanges||[];if(!paused&&rg.length)$('wBody').textContent+='\nวันที่ร้านหยุด: '+rg.map(rangeTxt).join(', ');
  const n=$('wNote');n.textContent=sh.note||'';n.style.display=sh.note?'block':'none';
  welcome.style.display='flex';
}
function render(){
  $('shop').textContent=cfg.shopName;
  $('hours').textContent='รับออเดอร์นัดเวลา '+cfg.openTime+' - '+cfg.closeTime+' น.';
  if(!cfg.open){$('banner').style.display='block';$('banner').textContent='ขณะนี้ร้านปิดรับออเดอร์ออนไลน์ชั่วคราว';}
  else if(cfg.shop&&cfg.shop.closedToday){$('banner').style.display='block';$('banner').textContent='วันนี้ร้านปิด — เลือกนัดวันอื่นได้';}
  const wrap=$('menu');wrap.innerHTML='';
  if(!cfg.menus.length){wrap.innerHTML='<p style="padding:24px 16px">ยังไม่มีเมนูให้สั่งออนไลน์</p>';return;}
  const groups={};cfg.menus.forEach(m=>(groups[m.category||'เมนูอื่นๆ']=groups[m.category||'เมนูอื่นๆ']||[]).push(m));
  const order=Array.isArray(cfg.categories)?cfg.categories:[];
  const catList=[...order.filter(c=>groups[c]),...Object.keys(groups).filter(c=>!order.includes(c))];
  catList.forEach(cat=>{
    const h=document.createElement('h2');h.textContent=cat;if(groups[cat].every(m=>m.soldOut)){h.append(Object.assign(document.createElement('span'),{className:'ct',textContent:'ปิดชั่วคราว'}));}wrap.appendChild(h);
    const g=document.createElement('div');g.className='grid';wrap.appendChild(g);
    groups[cat].forEach(m=>{
      const c=document.createElement('div');c.className='card';
      const img=m.image?Object.assign(document.createElement('img'),{src:m.image,alt:''}):Object.assign(document.createElement('div'),{className:'ph',textContent:'🍉'});
      const nm=Object.assign(document.createElement('div'),{className:'nm',textContent:m.name});
      const pr=Object.assign(document.createElement('div'),{className:'pr',textContent:baht(m.price)});
      const st=document.createElement('div');st.className='step';
      const minus=Object.assign(document.createElement('button'),{textContent:'−'});
      const q=Object.assign(document.createElement('span'),{textContent:'0'});
      const plus=Object.assign(document.createElement('button'),{textContent:'+',className:'plus'});
      if(m.soldOut){c.classList.add('out');c.append(img,nm,pr,Object.assign(document.createElement('div'),{className:'soldtag',textContent:'หมดชั่วคราว'}));g.appendChild(c);return;}
      const set=v=>{v=Math.max(0,Math.min(m.maxQty||20,v));cart[m.id]=v;q.textContent=v;bar();};
      minus.onclick=()=>set((cart[m.id]||0)-1);plus.onclick=()=>set((cart[m.id]||0)+1);
      if(m.pickMax>0){
        const pb=Object.assign(document.createElement('button'),{className:'btn',textContent:cfg.fruits.length?'เลือกผลไม้':'วันนี้ยังไม่เปิดให้เลือก',disabled:!cfg.fruits.length});
        pb.style.cssText='margin-top:8px;padding:10px;font-size:14px';pb.onclick=()=>openPick(m);c.append(img,nm,pr,pb);
      }else{st.append(minus,q,plus);c.append(img,nm,pr,st);}
      g.appendChild(c);
    });
  });
}
function bar(){
  const n=count();$('bar').style.display=n&&canOrder()?'block':'none';
  $('cartBtn').textContent='ดูตะกร้า ('+n+' ชิ้น) '+baht(total());
}
function slots(dayStr){
  const [oh,om]=cfg.openTime.split(':').map(Number),[ch,cm]=cfg.closeTime.split(':').map(Number);
  const earliest=Date.now()+(cfg.minLeadMinutes+1)*60000,out=[];
  for(let t=oh*60+om;t<=ch*60+cm;t+=30){
    const d=new Date(dayStr+'T'+pad(Math.floor(t/60))+':'+pad(t%60)+':00');
    if(d.getTime()>=earliest)out.push(pad(Math.floor(t/60))+':'+pad(t%60));
  }return out;
}
function fillDays(){
  const s=$('day');s.innerHTML='';
  for(let i=0;i<=cfg.maxDaysAhead;i++){
    const d=new Date(Date.now()+i*86400000),v=fmt(d);
    if(closedOn(v))continue;
    if(!slots(v).length)continue;
    const o=document.createElement('option');o.value=v;
    o.textContent=(i===0?'วันนี้ ':'')+d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});s.appendChild(o);
  }
  fillTimes();
}
function fillTimes(){
  const s=$('time');s.innerHTML='';
  slots($('day').value||fmt(new Date())).forEach(t=>{const o=document.createElement('option');o.value=o.textContent=t;s.appendChild(o);});
}
$('day').onchange=fillTimes;
document.querySelectorAll('input[name=m]').forEach(r=>r.onchange=()=>$('addrBox').style.display=document.querySelector('input[name=m]:checked').value==='นัดส่ง'?'block':'none');
$('cartBtn').onclick=()=>{
  const L=$('lines');L.innerHTML='';
  cfg.menus.filter(m=>cart[m.id]).forEach(m=>{
    const d=document.createElement('div');d.className='line';
    d.append(Object.assign(document.createElement('span'),{textContent:m.name+' x '+cart[m.id]}),Object.assign(document.createElement('span'),{textContent:baht(m.price*cart[m.id])}));L.appendChild(d);
  });
  picks.forEach((p,i)=>{
    const d=document.createElement('div');d.className='line';
    const x=Object.assign(document.createElement('button'),{textContent:'✕'});x.style.cssText='border:none;background:none;color:#b23a3a;font-size:16px';
    x.onclick=()=>{picks.splice(i,1);bar();if(count()){$('cartBtn').onclick();}else sheet.style.display='none';};
    d.append(Object.assign(document.createElement('span'),{textContent:p.name+' x '+p.qty+' ('+p.fruits.join(', ')+')'}),Object.assign(document.createElement('span'),{textContent:baht(p.price*p.qty)}),x);L.appendChild(d);
  });
  const t=document.createElement('div');t.className='line tot';
  t.append(Object.assign(document.createElement('span'),{textContent:'รวม (ยังไม่รวมค่าส่ง)'}),Object.assign(document.createElement('span'),{textContent:baht(total())}));L.appendChild(t);
  try{const s=JSON.parse(localStorage.getItem('2kor_cust')||'{}');$('name').value=s.name||'';$('phone').value=s.phone||'';$('addr').value=s.addr||'';}catch(e){}
  fillDays();$('err').textContent='';sheet.style.display='flex';
};
$('submit').onclick=async()=>{
  const method=document.querySelector('input[name=m]:checked').value;
  if(!$('time').value){$('err').textContent='ไม่มีเวลาว่างให้เลือก กรุณาเลือกวันอื่น';return;}
  const body={action:'createOrder',name:$('name').value,phone:$('phone').value,method,when:$('day').value+' '+$('time').value,
    address:$('addr').value,note:$('note').value,website:$('website').value,
    items:Object.keys(cart).filter(k=>cart[k]>0).map(k=>({id:k,qty:cart[k]})).concat(picks.map(p=>({id:p.id,qty:p.qty,fruits:p.fruits})))};
  $('submit').disabled=true;$('submit').textContent='กำลังส่ง…';$('err').textContent='';
  try{
    const r=await (await fetch(GAS_URL,{method:'POST',body:JSON.stringify(body)})).json();
    if(r.ok){
      localStorage.setItem('2kor_cust',JSON.stringify({name:body.name,phone:body.phone,addr:body.address}));
      picks=[];saveMy(myList().concat({id:r.orderId,key:r.trackKey}));
      sheet.style.display='none';$('menu').style.display='none';$('bar').style.display='none';
      $('doneTxt').textContent='เลขออเดอร์ '+r.orderId+' ยอด '+baht(r.total)+' — ร้านจะติดต่อกลับทางเบอร์ที่ให้ไว้เพื่อยืนยันออเดอร์'+(method==='นัดส่ง'?'และแจ้งค่าส่ง':'')+' (รหัสติดตาม '+r.trackKey+')';
      $('done').style.display='block';scrollTo(0,0);
    }else $('err').textContent=r.error||'ส่งออเดอร์ไม่สำเร็จ';
  }catch(e){$('err').textContent='เชื่อมต่อไม่ได้ กรุณาลองใหม่';}
  $('submit').disabled=false;$('submit').textContent='ส่งออเดอร์';
};
let pickM=null;
function openPick(m){
  pickM=m;$('pickTitle').textContent=m.name+' — เลือกได้สูงสุด '+m.pickMax+' ชนิด';
  const box=$('pickBox');box.innerHTML='';
  cfg.fruits.forEach(f=>{
    const l=document.createElement('label');l.style.cssText='display:flex;gap:10px;align-items:center;margin:6px 0;font-weight:500;background:#fff;border:1.4px solid #d8d2c2;border-radius:10px;padding:10px';
    const i=Object.assign(document.createElement('input'),{type:'checkbox',value:f});i.style.width='auto';
    i.onchange=()=>{if(box.querySelectorAll('input:checked').length>m.pickMax){i.checked=false;$('pickErr').textContent='เลือกได้สูงสุด '+m.pickMax+' ชนิด';}else $('pickErr').textContent='';};
    l.append(i,document.createTextNode(f));box.appendChild(l);
  });
  $('pickQty').value=1;$('pickErr').textContent='';$('pickSheet').style.display='flex';
}
$('pickAdd').onclick=()=>{
  const fr=[...$('pickBox').querySelectorAll('input:checked')].map(i=>i.value),q=Math.floor(Number($('pickQty').value));
  if(!fr.length){$('pickErr').textContent='กรุณาเลือกผลไม้อย่างน้อย 1 ชนิด';return;}
  if(!(q>=1&&q<=(pickM.maxQty||20))){$('pickErr').textContent='จำนวนต้องอยู่ระหว่าง 1-'+(pickM.maxQty||20);return;}
  picks.push({id:pickM.id,name:pickM.name,price:pickM.price,fruits:fr,qty:q});$('pickSheet').style.display='none';bar();
};
const MY='2kor_myorders',FINAL=['เสร็จสิ้น','ยกเลิก'];
const myList=()=>{try{return JSON.parse(localStorage.getItem(MY)||'[]')}catch(e){return[]}};
const saveMy=l=>localStorage.setItem(MY,JSON.stringify(l.slice(-30)));
const HINT={'รอรับ':'รอร้านยืนยันออเดอร์','รับแล้ว':'ร้านรับออเดอร์แล้ว กำลังเตรียมของ','เสร็จสิ้น':'เสร็จเรียบร้อย ขอบคุณที่อุดหนุน','ยกเลิก':'ออเดอร์นี้ถูกยกเลิก'};
let mineTimer=null;
function openMine(){$('mine').classList.add('show');refreshMine();clearInterval(mineTimer);mineTimer=setInterval(refreshMine,20000);}
function closeMine(){$('mine').classList.remove('show');clearInterval(mineTimer);}
async function refreshMine(){
  const box=$('mineList'),list=myList();
  if(!list.length){box.innerHTML='<p style="padding:16px 0">ยังไม่มีออเดอร์ที่สั่งจากเครื่องนี้</p>';return;}
  let r;try{r=await (await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'getOrderStatus',orders:list})})).json();}catch(e){return;}
  if(!r.ok)return;
  const today=fmt(new Date());
  // พอหลังบ้านกด "เสร็จสิ้น" ออเดอร์จะหายจากรายการนี้ทันที (ยกเลิก = แสดงถึงสิ้นวันนัด)
  const keep=r.orders.filter(o=>o.status!=='เสร็จสิ้น'&&!(o.status==='ยกเลิก'&&o.when.slice(0,10)<today));
  saveMy(list.filter(l=>keep.some(k=>k.id===l.id)));
  box.innerHTML='';
  if(!keep.length){box.innerHTML='<p style="padding:16px 0">ไม่มีออเดอร์ค้างอยู่</p>';return;}
  keep.sort((a,b)=>b.when.localeCompare(a.when)).forEach(o=>{
    const c=document.createElement('div');c.className='oc';
    const t=document.createElement('div');t.style.cssText='display:flex;justify-content:space-between;font-weight:600';
    t.append(Object.assign(document.createElement('span'),{textContent:o.id}),Object.assign(document.createElement('span'),{textContent:baht(o.total)}));
    const st=Object.assign(document.createElement('span'),{className:'st'+(o.status==='เสร็จสิ้น'?' ok':o.status==='ยกเลิก'?' no':''),textContent:o.status});
    const hint=o.status==='พร้อมรับ/กำลังส่ง'?(o.method==='รับเอง'?'พร้อมให้มารับที่ร้านแล้ว':'กำลังจัดส่ง'):HINT[o.status]||'';
    c.append(t,st,Object.assign(document.createElement('div'),{className:'sub',textContent:hint}),Object.assign(document.createElement('div'),{className:'sub',textContent:o.method+' · นัด '+o.when}));
    o.items.forEach(i=>c.appendChild(Object.assign(document.createElement('div'),{className:'sub',textContent:i.name+' x '+i.qty+(i.fruits&&i.fruits.length?' : '+i.fruits.join(', '):'')})));
    box.appendChild(c);
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
load();
</script>
